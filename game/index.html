<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VOWLIGHT — keep the flame, return the dark</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #03070a; }
    body { display: grid; place-items: center; }
    #field { display: block; width: 100vw; height: 100vh; cursor: crosshair; image-rendering: auto; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0;
    }
    noscript { color: #e9f1f2; font: 600 15px/1.5 system-ui, sans-serif; padding: 2rem; }
  </style>
</head>
<body>
  <canvas id="field" width="1280" height="720" aria-label="VOWLIGHT arena"></canvas>
  <p id="status" class="sr-only" role="status" aria-live="polite">VOWLIGHT. Press space to begin.</p>
  <noscript>VOWLIGHT needs JavaScript to run the arena.</noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
